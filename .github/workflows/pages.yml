name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "acoes/**"
      - "guias/**"
      - "modelos/**"
      - "jurisprudencia/**"
      - "legislacao/**"
      - "fontes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build public-only artifact
        run: |
          mkdir -p _site/assets _site/acoes _site/guias _site/modelos _site/jurisprudencia _site/legislacao _site/fontes
          cp index.html _site/index.html
          cp -R assets/. _site/assets/
          cp acoes/*.html _site/acoes/
          cp guias/*.html _site/guias/
          cp modelos/*.html _site/modelos/
          cp jurisprudencia/*.html _site/jurisprudencia/
          cp legislacao/*.html _site/legislacao/
          cp fontes/*.html _site/fontes/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
